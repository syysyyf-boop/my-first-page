<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聊天</title>
  <style>
    body {
      background-image: url('bg.PNG');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      font-family: sans-serif;
      margin: 0;
      padding: 0;
      font-size: 14px;
    }

    /* 頂部 bar */
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: rgba(20, 20, 30, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .top-bar-center {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .top-bar-name {
      font-size: 16px;
      font-weight: bold;
      color: #ffffff;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    }

    .top-bar-sub {
      font-size: 11px;
      color: #8a9aaa;
      margin-top: 2px;
    }

    .top-bar-btn {
      color: #a8b8c8;
      font-size: 20px;
      background: none;
      border: none;
      padding: 4px 8px;
      cursor: pointer;
    }

    .chat {
      max-width: 700px;
      margin: 0 auto;
      padding: 72px 16px 90px;
    }

    .message {
      display: flex;
      align-items: flex-end;
      margin-bottom: 16px;
    }

    .message.right {
      flex-direction: row-reverse;
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      margin: 0 8px;
      flex-shrink: 0;
      object-fit: cover;
    }

    .msg-content {
      display: flex;
      flex-direction: column;
      max-width: 65%;
    }

    .message.right .msg-content {
      align-items: flex-end;
    }

    .message.left .msg-content {
      align-items: flex-start;
    }

    /* 液態玻璃氣泡 */
    .bubble {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #e8e8e8;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 15px;
      word-break: break-word;
      white-space: pre-wrap;
      box-shadow: 0 2px 12px rgba(0,0,0,0.2);
    }

    .message.right .bubble {
      background: rgba(58, 90, 130, 0.45);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(100, 150, 220, 0.2);
    }

    .time-row {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 4px;
    }

    .time {
      font-size: 11px;
      color: #888;
    }

    .read-status {
      font-size: 11px;
      color: #7a9ab8;
    }

    /* 輸入欄 */
    .input-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      padding: 10px 16px;
      background: rgba(20, 20, 30, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid rgba(255,255,255,0.08);
      gap: 8px;
    }

    .input-bar input {
      flex: 1;
      padding: 10px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #e0e0e0;
      font-size: 15px;
      outline: none;
    }

    .input-bar input::placeholder {
      color: #666;
    }

    .input-bar button {
      padding: 10px 18px;
      border-radius: 20px;
      border: none;
      background-color: #3a5070;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- 頂部 bar -->
  <div class="top-bar">
    <button class="top-bar-btn">&#8249;</button>
    <div class="top-bar-center">
      <div class="top-bar-name">明</div>
      <div class="top-bar-sub">如果我足够像他你就会爱我了吗</div>
    </div>
    <button class="top-bar-btn">&#8943;</button>
  </div>

  <div class="chat" id="chatArea">

    <div class="message left">
      < img class="avatar" src="avatar-left.PNG">
      <div class="msg-content">
        <div class="bubble">小猫离？</div>
        <div class="time-row">
          <span class="time">23:43</span>
        </div>
      </div>
    </div>

    <div class="message right">
      < img class="avatar" src="avatar-right.PNG">
      <div class="msg-content">
        <div class="bubble">你好喵喵喵喵！我是阿离喵</div>
        <div class="time-row">
          <span class="time">23:43</span>
          <span class="read-status">已讀</span>
        </div>
      </div>
    </div>

    <div class="input-bar">
      <input type="text" id="msgInput" placeholder="消息" />
      <button onclick="sendMessage()">發送</button>
    </div>
  </div>

  <script>
    function getTime() {
      var now = new Date();
      var h = now.getHours().toString().padStart(2, '0');
      var m = now.getMinutes().toString().padStart(2, '0');
      return h + ':' + m;
    }

    function sendMessage() {
      var input = document.getElementById("msgInput");
      var text = input.value.trim();
      if (text === "") return;

      var chatArea = document.getElementById("chatArea");
      var inputBar = document.querySelector(".input-bar");

      var msg = document.createElement("div");
      msg.className = "message right";
      msg.innerHTML = `
        < img class="avatar" src="avatar-right.PNG">
        <div class="msg-content">
          <div class="bubble">${text}</div>
          <div class="time-row">
            <span class="time">${getTime()}</span>
            <span class="read-status">未讀</span>
          </div>
        </div>
      `;

      chatArea.insertBefore(msg, inputBar);
      input.value = "";
      window.scrollTo(0, document.body.scrollHeight);

      // 3秒後變已讀
      setTimeout(function() {
        var status = msg.querySelector(".read-status");
        if (status) status.textContent = "已讀";
      }, 3000);
    }

    document.getElementById("msgInput").addEventListener("keydown", function(e) {
      if (e.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
