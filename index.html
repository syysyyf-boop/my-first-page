<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聊天</title>
  <style>
    body {
      background-image: url('bg.PNG');
      background-size: cover;
      background-position: center;
      background-repeat:no-repeat;
      background-attachment:fixed;
      font-family: sans-serif;
      margin: 0;
      padding: 0;
      font-size: 14px;
    }

    .chat {
      max-width: 700px;
      margin: 0 auto;
      padding: 20px 16px 80px;
    }

    .header {
      text-align: center;
      padding: 20px 0 30px;
    }

    .header-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      margin: 0 auto 12px;
      object-fit: cover;
      display: block;
    }

    .header-name {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 6px;
      color:＃a8b8c8
    }

    .header-sub {
      font-size: 13px;
      color: #7a8a9a;
    }

    .message {
      display: flex;
      align-items: flex-end;
      margin-bottom: 16px;
    }

    .message.right {
      flex-direction: row-reverse;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      margin: 0 8px;
      flex-shrink: 0;
      object-fit: cover;
    }

    .msg-content {
      display: flex;
      flex-direction: column;
      max-width: 65%;
    }

    .message.right .msg-content {
      align-items: flex-end;
    }

    .message.left .msg-content {
      align-items: flex-start;
    }

    .bubble {
      background-color: rgba(40,40,50,0.75);
      color:＃e0e0e0;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 15px;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .message.right .bubble {
      background-color: rgba(50,70,100,0.75);
    }

    .time {
      font-size: 11px;
      color: #aaa;
      margin-top: 4px;
    }

    .input-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      padding: 10px 16px;
      background-color: rgba(20,20,30,0.9)
      border-top: 1px solid #ddd;
      gap: 8px;
    }

    .input-bar input {
      flex: 1;
      padding: 10px 14px;
      border-radius: 20px;
      border: 1px solid #ddd;
      font-size: 15px;
      outline: none;
    }

    .input-bar button {
      padding: 10px 18px;
      border-radius: 20px;
      border: none;
      background-color: #1E90FF;
      color: white;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <div class="chat">
    <div class="header">
      <img class="header-avatar" src="avatar-left.PNG">
      <div class="header-name">明</div>
      <div class="header-sub">你的世界裡能不能多一點我存在的痕跡</div>
    </div>

    <div class="message left">
      <img class="avatar" src="avatar-left.PNG">
      <div class="msg-content">
        <div class="bubble">小猫离？</div>
        <div class="time">23:43</div>
      </div>
    </div>

    <div class="message right">
      <img class="avatar" src="avatar-right.PNG">
      <div class="msg-content">
        <div class="bubble">你好喵喵喵喵！我是阿离喵</div>
        <div class="time">23:43</div>
      </div>
    </div>

    <div class="input-bar">
      <input type="text" id="msgInput" placeholder="消息" />
      <button onclick="sendMessage()">發送</button>
    </div>
  </div>

  <script>
    function getTime() {
      var now = new Date();
      var h = now.getHours().toString().padStart(2, '0');
      var m = now.getMinutes().toString().padStart(2, '0');
      return h + ':' + m;
    }

    function sendMessage() {
      var input = document.getElementById("msgInput");
      var text = input.value.trim();
      if (text === "") return;

      var chat = document.querySelector(".chat");
      var inputBar = document.querySelector(".input-bar");

      var msg = document.createElement("div");
      msg.className = "message right";
      msg.innerHTML = `
        <img class="avatar" src="avatar-right.PNG">
        <div class="msg-content">
          <div class="bubble">${text}</div>
          <div class="time">${getTime()}</div>
        </div>
      `;

      chat.insertBefore(msg, inputBar);
      input.value = "";
      window.scrollTo(0, document.body.scrollHeight);
    }

    document.getElementById("msgInput").addEventListener("keydown", function(e) {
      if (e.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
