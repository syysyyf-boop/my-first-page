<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聊天</title>
  <style>
    body {
      background-image: url('bg.PNG');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      font-family: sans-serif;
      margin: 0;
      padding: 0;
      font-size: 14px;
    }

    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: rgba(20, 20, 30, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .top-bar-center {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .top-bar-name {
      font-size: 16px;
      font-weight: bold;
      color: #ffffff;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    }

    .top-bar-sub {
      font-size: 11px;
      color: #8a9aaa;
      margin-top: 2px;
    }

    .top-bar-btn {
      color: #a8b8c8;
      font-size: 20px;
      background: none;
      border: none;
      padding: 4px 8px;
      cursor: pointer;
    }

    .chat {
      max-width: 700px;
      margin: 0 auto;
      padding: 72px 16px 90px;
    }

    .message {
      display: flex;
      align-items: flex-end;
      margin-bottom: 16px;
    }

    .message.right {
      flex-direction: row-reverse;
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      margin: 0 8px;
      flex-shrink: 0;
      object-fit: cover;
    }

    .msg-content {
      display: flex;
      flex-direction: column;
      max-width: 65%;
    }

    .message.right .msg-content {
      align-items: flex-end;
    }

    .message.left .msg-content {
      align-items: flex-start;
    }

    .bubble {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #e8e8e8;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 15px;
      word-break: break-word;
      white-space: pre-wrap;
      box-shadow: 0 2px 12px rgba(0,0,0,0.2);
    }

    .message.right .bubble {
      background: rgba(58, 90, 130, 0.45);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(100, 150, 220, 0.2);
    }

    .time-row {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 4px;
    }

    .time {
      font-size: 11px;
      color: #888;
    }

    .read-status {
      font-size: 11px;
      color: #7a9ab8;
    }

    /* 正在輸入 */
    .typing-indicator {
      display: none;
      align-items: flex-end;
      margin-bottom: 16px;
    }

    .typing-indicator.show {
      display: flex;
    }

    .typing-bubble {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 10px 16px;
      border-radius: 18px;
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .typing-bubble span {
      width: 7px;
      height: 7px;
      background: #a8b8c8;
      border-radius: 50%;
      display: inline-block;
      animation: typing-bounce 1.6s infinite ease-in-out;
    }

    .typing-bubble span:nth-child(2) { animation-delay: 0.3s; }
    .typing-bubble span:nth-child(3) { animation-delay: 0.6s; }

    @keyframes typing-bounce {
    0%, 100% { opacity: 0.25; transform: scale(0.85); }
    50% { opacity: 1; transform: scale(1); }
    }

    .input-bar {
      display: flex;
      padding: 10px 16px;
      background: rgba(20, 20, 30, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid rgba(255,255,255,0.08);
      gap: 8px;
    }

    .input-bar input {
      flex: 1;
      padding: 10px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #e0e0e0;
      font-size: 15px;
      outline: none;
    }

    .input-bar input:placeholder {
      color: #666;
    }

    .input-bar button {
  padding: 10px 18px;
  border-radius: 20px;
  border: none;
  background-color: #3a5070;
  color: white;
  font-size: 15px;
  cursor: pointer;
}

.icon-btn {
  background: rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 12px;
  font-size: 20px;
  padding: 8px 10px;
  cursor: pointer;
  flex-shrink: 0;
  color: #e0e0e0;
  line-height: 1;
}
.input-wrapper {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 100;
}

.emoji-panel {
  display: none;
  left: 0;
  right: 0;
  background: rgba(20, 20, 30, 0.92);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid rgba(255,255,255,0.08);
  padding: 12px 16px;
  flex-wrap: wrap;
  gap: 12px;
  z-index: 99;
}

.emoji-panel.show {
  display: flex;
}

.emoji-panel span {
  font-size: 16px;
  cursor: pointer;
  color:#e0e0e0;
}
  </style>
</head>
<body>

  <div class="top-bar">
    <button class="top-bar-btn">&#8249;</button>
    <div class="top-bar-center">
      <div class="top-bar-name">明</div>
      <div class="top-bar-sub">生锈的感情又逢下雨天</div>
    </div>
    <button class="top-bar-btn">&#8943;</button>
  </div>

  <div class="chat" id="chatArea">

    <div class="message left" data-read="false">
      <img class="avatar" src="avatar-left.PNG">
      <div class="msg-content">
        <div class="bubble">小猫离？</div>
        <div class="time-row">
          <span class="time">23:43</span>
          <span class="read-status">未讀</span>
        </div>
      </div>
    </div>

    <div class="message right">
      <img class="avatar" src="avatar-right.PNG">
      <div class="msg-content">
        <div class="bubble">你好喵喵喵喵！我是阿离喵</div>
        <div class="time-row">
          <span class="time">23:43</span>
          <span class="read-status">已讀</span>
        </div>
      </div>
    </div>

    <!-- 正在輸入提示 -->
    <div class="typing-indicator" id="typingIndicator">
      <img class="avatar" src="avatar-left.PNG">
      <div class="typing-bubble">
        <span></span><span></span><span></span>
      </div>
    </div>

    <div class="input-wrapper">
    <div class="input-bar">
  <button class="icon-btn" onclick="toggleEmoji()">★</button>
<button class="icon-btn" onclick="document.getElementById('imgInput').click()">☆</button>
  <input type="file" id="imgInput" accept="image/*" style="display:none" onchange="sendImage(this)">
  <input type="text" id="msgInput" placeholder="像我这样的人 我这样 我怎样" />
  <button onclick="sendMessage()">發送</button>
</div>

<!-- 表情面板 -->
<div class="emoji-panel" id="emojiPanel">
  <span onclick="insertEmoji(this)">⬮ω⬮</span><span onclick="insertEmoji(this)">•́₃•</span>
  <span onclick="insertEmoji(this)">っ⩊＜</span><span onclick="insertEmoji(this)">ᗜ-ᗜ</span>
  <span onclick="insertEmoji(this)">QᯅQ</span><span onclick="insertEmoji(this)">⌯QωQ⌯ಣ</span>
  <span onclick="insertEmoji(this)">☆v☆！！</span><span onclick="insertEmoji(this)">˶ꔷ×ꔷ˶</span>
  <span onclick="insertEmoji(this)">=ᗜࡇᗜ=</span><span onclick="insertEmoji(this)">𖦹ࡇ𖦹.ᐟ～</span>
  <span onclick="insertEmoji(this)">⦮_̫_⦯</span><span onclick="insertEmoji(this)">ÒωÓ！</span>
  <span onclick="insertEmoji(this)">˶꩜𖥦꩜˶</span><span onclick="insertEmoji(this)">^⦁⩊<^੭づ</span>
  <span onclick="insertEmoji(this)">⸝⸝⬮ω⬮⸝⸝</span><span onclick="insertEmoji(this)">◎～◎</span>
</div>
    </div>
  </div>
  </div>

  <script>
    // 已讀觀察器（左邊氣泡進入視野→已讀）
    var observer = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          var msg = entry.target;
          if (msg.dataset.read === "false") {
            msg.dataset.read = "true";
            var status = msg.querySelector(".read-status");
            if (status) status.textContent = "已讀";
            observer.unobserve(msg);
          }
        }
      });
    }, { threshold: 0.8 });

    function observeLeftMessages() {
      var leftMsgs = document.querySelectorAll(".message.left[data-read='false']");
      leftMsgs.forEach(function(msg) { observer.observe(msg); });
    }

    observeLeftMessages();

    // 正在輸入
    var typingTimer = null;
    var typingIndicator = document.getElementById("typingIndicator");

    document.getElementById("msgInput").addEventListener("input", function() {
      if (this.value.trim() !== "") {
        typingIndicator.classList.add("show");
        window.scrollTo(0, document.body.scrollHeight);
        clearTimeout(typingTimer);
        typingTimer = setTimeout(function() {
          typingIndicator.classList.remove("show");
        }, 2000);
      } else {
        typingIndicator.classList.remove("show");
        clearTimeout(typingTimer);
      }
    });

    function getTime() {
      var now = new Date();
      var h = now.getHours().toString().padStart(2, '0');
      var m = now.getMinutes().toString().padStart(2, '0');
      return h + ':' + m;
    }

    function sendMessage() {
      var input = document.getElementById("msgInput");
      var text = input.value.trim();
      if (text === "") return;

      typingIndicator.classList.remove("show");
      clearTimeout(typingTimer);

      var chatArea = document.getElementById("chatArea");
      var indicator = document.getElementById("typingIndicator");

      var msg = document.createElement("div");
      msg.className = "message right";
      msg.innerHTML = `
        <img class="avatar" src="avatar-right.PNG">
        <div class="msg-content">
          <div class="bubble">${text}</div>
          <div class="time-row">
            <span class="time">${getTime()}</span>
            <span class="read-status">未讀</span>
          </div>
        </div>
      `;

      chatArea.insertBefore(msg, indicator);
      input.value = "";
      window.scrollTo(0, document.body.scrollHeight);

      setTimeout(function() {
        var status = msg.querySelector(".read-status");
        if (status) status.textContent = "已讀";
      }, 3000);
    }

    document.getElementById("msgInput").addEventListener("keydown", function(e) {
      if (e.key === "Enter") sendMessage();
    });
 function toggleEmoji() {
  document.getElementById("emojiPanel").classList.toggle("show");
}

  var panel = document.getElementById("emojiPanel");
  var btn = e.target.closest(".icon-btn");
  if (!btn && !panel.contains(e.target)) {
    panel.classList.remove("show");
  }
}）


function insertEmoji(el) {
  var input = document.getElementById("msgInput");
  input.value += el.textContent;
  document.getElementById("emojiPanel").classList.remove("show");
  input.focus();
}

function sendImage(input) {
  var file = input.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    var chatArea = document.getElementById("chatArea");
    var indicator = document.getElementById("typingIndicator");
    var msg = document.createElement("div");
    msg.className = "message right";
    msg.innerHTML = `
      <img class="avatar" src="avatar-right.PNG">
      <div class="msg-content">
        <img src="${e.target.result}" style="max-width:200px;border-radius:12px;display:block;">
        <div class="time-row">
          <span class="time">${getTime()}</span>
          <span class="read-status">未讀</span>
        </div>
      </div>
    `;
    chatArea.insertBefore(msg, indicator);
    window.scrollTo(0, document.body.scrollHeight);
    setTimeout(function() {
      var status = msg.querySelector(".read-status");
      if (status) status.textContent = "已讀";
    }, 3000);
  };
  reader.readAsDataURL(file);
  input.value = "";
}
 </script>
</body>
</html>
